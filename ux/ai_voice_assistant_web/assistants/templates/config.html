<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<div class="container mt-4">
  <div class="card shadow p-4">

    <h4 class="mb-4">AI Voice Assistant – Configuration</h4>

    <!-- Tabs -->
    <ul class="nav nav-tabs mb-3">
      <li class="nav-item">
        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#airport">✈ Airport</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#medical">🏥 Medical</button>
      </li>
      <li class="nav-item">
        <button class="nav-link disabled">🍽 Restaurant</button>
      </li>
    </ul>

    <div class="tab-content">

      <!-- ✈ AIRPORT TAB -->
      <div class="tab-pane fade show active" id="airport">
        <form method="post">
          {% csrf_token %}
          <input type="hidden" name="business_sector" value="Airport">

          <div class="mb-3">
            <label>Twilio Number</label>
            <input class="form-control" name="twilio_number">
          </div>

          <div class="mb-3">
            <label>Assistant Name</label>
            <input class="form-control" name="assistant_name" value="Airport Assistant AI">
          </div>

          <div class="mb-3">
            <label>Role</label>
            <input class="form-control" name="role" value="Informational Only">
          </div>

          <div class="mb-3">
            <label>Languages Supported</label>
            <select class="form-select" name="languages" multiple>
              <option>English</option>
              <option>French</option>
              <option>Spanish</option>
              <option>Hindi</option>
            </select>
          </div>

          <div class="mb-3">
            <label>Accents</label>
            <select class="form-select" name="accents" multiple>
              <option>American English</option>
              <option>British English</option>
              <option>Indian English</option>
            </select>
          </div>
          <hr class="my-3">

          <div class="mb-3">
            <label class="form-label">Supported Services</label>
            <div class="row">
              <div class="col-md-3 form-check">
                <input class="form-check-input" type="checkbox" name="services[]" value="flight_status" checked>
                <label class="form-check-label">Flight Status</label>
              </div>
              <div class="col-md-3 form-check">
                <input class="form-check-input" type="checkbox" name="services[]" value="booking">
                <label class="form-check-label">Ticket Booking</label>
              </div>
              <div class="col-md-3 form-check">
                <input class="form-check-input" type="checkbox" name="services[]" value="cancellation">
                <label class="form-check-label">Cancel Ticket</label>
              </div>
              <div class="col-md-3 form-check">
                <input class="form-check-input" type="checkbox" name="services[]" value="general_info">
                <label class="form-check-label">Airport Info</label>
              </div>
            </div>
          </div>
          <!-- Voice Settings -->
          <div class="mb-3">
            <label>Voice Tone</label>
            <div class="d-flex gap-3">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="voice_tone" value="Professional" checked>
                <label class="form-check-label">Professional</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="voice_tone" value="Friendly">
                <label class="form-check-label">Friendly</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="voice_tone" value="Urgent">
                <label class="form-check-label">Urgent</label>
              </div>
            </div>
          </div>

          <div class="mb-3">
            <label>Speaking Speed</label>
            <div class="d-flex gap-3">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="speaking_speed" value="Slow">
                <label class="form-check-label">Slow</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="speaking_speed" value="Normal" checked>
                <label class="form-check-label">Normal</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="speaking_speed" value="Fast">
                <label class="form-check-label">Fast</label>
              </div>
            </div>
          </div>

          <div class="mb-3">
            <label>Escalation Rules</label>
            <textarea class="form-control" name="escalation_rules" rows="3"></textarea>
          </div>
        <h6>Escalation Policy</h6>

        <div class="mb-3">
          <label>Escalate After</label>
          <select class="form-select" name="escalate_after">
            <option value="1">1 Repeated Question</option>
            <option value="2" selected>2 Repeated Questions</option>
            <option value="3">3 Repeated Questions</option>
          </select>
        </div>

        <div class="mb-3">
          <label>Handoff Message</label>
          <input class="form-control" name="handoff_message"
                placeholder="Transferring you to a staff member now.">
        </div>
          <div class="text-end">
            <button class="btn btn-success">Save Airport Config</button>
          </div>
        </form>

        <!-- Existing Records -->
        <hr class="my-4">

<h5>All Assistants (Generic Records)</h5>
<table class="table table-striped table-bordered align-middle">
  <thead class="table-light">
    <tr>
      <th>ID</th>
      <th>Twilio Number</th>
      <th>Business Sector</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for r in records %}
    <tr>
      <td>{{ r.id }}</td>
      <td>{{ r.twilio_number }}</td>
      <td>{{ r.business_sector }}</td>
      <td>
        <a href="{% url 'edit_assistant' r.id %}" class="btn btn-sm btn-primary">Edit</a>
        <a href="{% url 'delete_assistant' r.id %}" class="btn btn-sm btn-danger">Delete</a>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
      </div>

      <!-- 🏥 MEDICAL TAB -->
      <div class="tab-pane fade" id="medical">
        <form method="post">
          {% csrf_token %}
          <input type="hidden" name="business_sector" value="Medical">

          <div class="mb-3">
            <label>Twilio Number</label>
            <input class="form-control" name="twilio_number">
          </div>

          <div class="mb-3">
            <label>Assistant Name</label>
            <input class="form-control" name="assistant_name" value="Medical Assistant AI">
          </div>

          <div class="mb-3">
            <label>Role</label>
            <input class="form-control" name="role" value="Patient Support">
          </div>

          <div class="mb-3">
            <label>Languages Supported</label>
            <select class="form-select" name="languages" multiple>
              <option>English</option>
              <option>Hindi</option>
            </select>
          </div>

          <div class="mb-3">
            <label>Accents</label>
            <select class="form-select" name="accents" multiple>
              <option>Indian English</option>
              <option>British English</option>
            </select>
          </div>
          <hr class="my-3">
          <div class="mb-3">
            <label class="form-label">Supported Services</label>
            <div class="row">
              <div class="col-md-3 form-check">
                <input class="form-check-input" type="checkbox" name="services[]" value="appointment_booking" checked>
                <label class="form-check-label">Book Appointment</label>
              </div>
              <div class="col-md-3 form-check">
                <input class="form-check-input" type="checkbox" name="services[]" value="cancel_appointment">
                <label class="form-check-label">Cancel Appointment</label>
              </div>
              <div class="col-md-3 form-check">
                <input class="form-check-input" type="checkbox" name="services[]" value="doctor_info">
                <label class="form-check-label">Doctor Info</label>
              </div>
              <div class="col-md-3 form-check">
                <input class="form-check-input" type="checkbox" name="services[]" value="clinic_hours">
                <label class="form-check-label">Clinic Timings</label>
              </div>
            </div>
          </div>
          <div class="mb-3">
            <label>Voice Tone</label>
            <div class="d-flex gap-3">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="voice_tone" value="Professional" checked>
                <label class="form-check-label">Professional</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="voice_tone" value="Friendly">
                <label class="form-check-label">Friendly</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="voice_tone" value="Urgent">
                <label class="form-check-label">Urgent</label>
              </div>
            </div>
          </div>

          <div class="mb-3">
            <label>Speaking Speed</label>
            <div class="d-flex gap-3">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="speaking_speed" value="Slow">
                <label class="form-check-label">Slow</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="speaking_speed" value="Normal" checked>
                <label class="form-check-label">Normal</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="speaking_speed" value="Fast">
                <label class="form-check-label">Fast</label>
              </div>
            </div>
          </div>

          <div class="mb-3">
            <label>Escalation Rules</label>
            <textarea class="form-control" name="escalation_rules" rows="3"></textarea>
          </div>
          <hr class="my-3">
        <h6>Escalation Policy</h6>

        <div class="mb-3">
          <label>Escalate After</label>
          <select class="form-select" name="escalate_after">
            <option value="1">1 Repeated Question</option>
            <option value="2" selected>2 Repeated Questions</option>
            <option value="3">3 Repeated Questions</option>
          </select>
        </div>

        <div class="mb-3">
          <label>Handoff Message</label>
          <input class="form-control" name="handoff_message"
                placeholder="Transferring you to a staff member now.">
        </div>

          <div class="text-end">
            <button class="btn btn-success">Save Medical Config</button>
          </div>
        </form>
      </div>

    </div>
  </div>
</div>
